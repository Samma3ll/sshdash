server:
  host: 0.0.0.0
  port: 23234
  host_key_path: .ssh/sshdash_ed25519
refresh: 30s
services:
  - name: router
    address: 192.168.1.1:80
    timeout: 2s
  - name: dns
    address: 1.1.1.1:53
    timeout: 2s
apis:
  - name: public-ip
    url: https://api.ipify.org?format=json
    parser: public_ip
    timeout: 5s
  - name: github
    url: https://www.githubstatus.com/api/v2/status.json
    parser: github_status
    timeout: 5s
  - name: homeassistant
    url: http://homeassistant.local:8123
    parser: homeassistant-status
    headers:
      Authorization: Bearer YOUR_LONG_LIVED_ACCESS_TOKEN
    timeout: 5s
  - name: jellyfin
    url: http://jellyfin.local:8096
    parser: jellyfin_status
    timeout: 5s
docker:
  enabled: false
  name: docker
  url: http://192.168.10.21:2375
  timeout: 5s
  show_stopped: true
proxmox:
  enabled: false
  name: proxmox
  url: https://192.168.10.10:8006
  token: "PVEAPIToken=user@pve!sshdash=secret"
  timeout: 8s
  mode: cluster
  nodes: []
  skip_tls_verify: true
proxmox_backup:
  enabled: false
  name: pbs
  url: https://192.168.10.11:8007
  token: "PBSAPIToken=user@pbs!sshdash:secret"
  datastores:
    - datastore-name
  timeout: 8s
  skip_tls_verify: true
weather:
  enabled: false
  name: weather
  location: Amsterdam
  timeout: 5s
